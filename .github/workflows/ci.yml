name: CI

# Gate obligatorio antes de mergear a main: tipos, lint y la suite de Vitest
# (contra una Postgres real, igual que en local — el proyecto no usa mocks de
# Prisma, así que un Postgres de mentira no vale). Hasta ahora los dos únicos
# workflows del repo eran crons de producción (reconcile-payments,
# cleanup-waiting-room); este es el primero que protege el propio código.
on:
  pull_request:
  push:
    # `plataforma` es la rama que sirve la web real (proyecto la-grailla-platform): sin esto se desplegaba sin ninguna prueba automática.
    branches: [main, plataforma]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lagrailla
          POSTGRES_PASSWORD: lagrailla
          POSTGRES_DB: lagrailla
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lagrailla"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # Postgres del servicio de arriba, sin pooler (no hace falta en CI).
      DATABASE_URL: postgresql://lagrailla:lagrailla@localhost:5432/lagrailla
      DIRECT_URL: postgresql://lagrailla:lagrailla@localhost:5432/lagrailla
      # Secreto de un solo uso para esta ejecución — no protege nada real.
      NEXTAUTH_SECRET: ci-test-secret-not-for-production-use-only
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Vercel instala con el gestor cuyo lockfile encuentre: un yarn.lock hacía que producción usara versiones distintas a las que
      # prueba esta CI (que usa package-lock.json). Un solo gestor: npm.
      - name: Un solo fichero de versiones (npm)
        run: |
          if [ -f yarn.lock ] || [ -f pnpm-lock.yaml ]; then
            echo "::error::Hay un lockfile de otro gestor (yarn.lock o pnpm-lock.yaml): Vercel instalaría con él en lugar de package-lock.json"
            exit 1
          fi

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Política de migraciones (solo aditivas)
        run: npm run check:migrations

      - name: Aplicar esquema de Prisma
        run: npx prisma migrate deploy

      - name: Tests (Vitest, en serie, contra Postgres real)
        run: npm test

  # Panel de control (apps/control-panel): app aparte con su propio Prisma, BD de control y suite.
  control-panel:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lagrailla
          POSTGRES_PASSWORD: lagrailla
          POSTGRES_DB: lagrailla_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lagrailla"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/control-panel

    env:
      # La BD debe terminar en _test: los tests se niegan a correr contra otra.
      CONTROL_DATABASE_URL: postgresql://lagrailla:lagrailla@localhost:5432/lagrailla_control_test
      CONTROL_DIRECT_URL: postgresql://lagrailla:lagrailla@localhost:5432/lagrailla_control_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: apps/control-panel/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Aplicar esquema de la BD de control
        run: npx prisma migrate deploy

      - name: Tests (Vitest, contra Postgres real)
        run: npm test

  # El build de verdad. Hasta ahora nada ejecutaba `next build`: un import roto, un runtime edge incompatible o una página estática con datos
  # de un cliente solo se habrían visto en Vercel, en el primer despliegue. Se compila como lo hará el proyecto `platform` (modo plataforma,
  # sin DATABASE_URL ni NEXTAUTH_*: ese despliegue no las tiene) y como el panel.
  build-front-platform:
    runs-on: ubuntu-latest
    env:
      PLATFORM_MODE: 'on'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build del front en modo plataforma
        run: npm run build:platform

  build-control-panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-panel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: apps/control-panel/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build del panel
        run: npm run build
